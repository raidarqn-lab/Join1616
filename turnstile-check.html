<script>
const gatewayKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5Y2JqeXRocXd1bXl6c2Vza2ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MzQ4NzQsImV4cCI6MjEwNTUxMDg3NH0.s_Jgo7cHnM9UNN8jlOQ8NtPw3rTD457woDuo8rTgEu4';
const status=document.querySelector('#status'),button=document.querySelector('#start');let widget;
window.ready=()=>{button.disabled=false;status.textContent='Ready on '+location.hostname;};
button.onclick=()=>{
 if(!['join1616.com','www.join1616.com'].includes(location.hostname)){status.textContent='Open this check on join1616.com or www.join1616.com.';return;}
 button.disabled=true;status.textContent='Complete the verification below.';

 widget=turnstile.render('#widget',{sitekey:'0x4AAAAAAE-fCGCUUZXY5vbJ',action:'transfer_intake',callback:async token=>{

   const data=await response.json();status.textContent=response.ok&&data.ok&&data.verificationOnly?'PASS - hostname, action and server verification accepted. Intake remains disabled.':'Verification failed (HTTP '+response.status+'). Intake remains disabled.';
  }catch{status.textContent='Connection check failed. Intake remains disabled.';}
  finally{button.disabled=false;}
 },'error-callback':()=>{status.textContent='Widget verification failed. Please retry.';button.disabled=false;},'expired-callback':()=>{status.textContent='Verification expired. Please retry.';button.disabled=false;}});
};
